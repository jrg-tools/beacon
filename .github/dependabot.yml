version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint supports TS < 6.1 only; drop once it supports 7.
      - dependency-name: typescript
        versions: ['>=6.1']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  # Bumps the tag and digest together in the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
